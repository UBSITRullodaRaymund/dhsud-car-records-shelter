<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In | DHSUD-CAR Records Shelter</title>
<link rel="icon" type="image/png" href="logo.png">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="login-body">

<div class="login-wrap">

    <div class="login-card">

        <div class="login-brand">

            <img src="logo.png" alt="DHSUD-CAR Logo">

            <h2>DHSUD-CAR</h2>
            <span>Records Shelter</span>

        </div>

        <h1>Sign In</h1>
        <p class="login-sub">Enter your assigned account credentials.</p>

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" maxlength="254" autocomplete="username" required placeholder="name@dhsud.gov.ph">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" autocomplete="current-password" required placeholder="••••••••">
            </div>

            <div id="loginError" class="login-error" style="display:none;"></div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In
            </button>

        </form>

        <p class="login-footnote">
            Accounts are issued by your division administrator.
            Contact IT support if you cannot access your account.
        </p>

    </div>

</div>

<script src="auth.js"></script>
<script>

const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");

async function validateSession(token) {
    const response = await fetch(`${API_URL}?action=validateSession&token=${encodeURIComponent(token)}`);
    const result = await response.json();

    if (result.success && result.user && result.csrfToken) return result;
    if (["Missing session token", "Invalid session", "Session expired"].includes(result.error)) return null;
    throw new Error(result.error || "Could not verify the current session.");
}

async function checkExistingSession() {
    const session = getSession();
    if (!session || !session.token) return;

    loginBtn.disabled = true;
    loginBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Checking session...`;

    try {
        const current = await validateSession(session.token);
        if (current) {
            saveSession(session.token, current.user, current.csrfToken);
            loginBtn.hidden = true;
            window.location.replace("index.html");
            return;
        }
        clearSession();
    } catch (err) {
        console.error(err);
        loginError.textContent = "Could not verify your current session. Please try again.";
        loginError.style.display = "block";
    }

    loginBtn.disabled = false;
    loginBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Sign In`;
}

checkExistingSession();

loginForm.addEventListener("submit", async function (e) {

    e.preventDefault();

    loginError.style.display = "none";
    loginBtn.disabled = true;
    loginBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Signing in...`;

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {
        const existingToken = getToken();
        if (existingToken) {
            const current = await validateSession(existingToken);
            if (current) {
                saveSession(existingToken, current.user, current.csrfToken);
                window.location.replace("index.html");
                return;
            }
            clearSession();
        }

        const formData = new FormData();
        formData.append("action", "login");
        formData.append("email", email);
        formData.append("password", password);

        const response = await fetch(API_URL, { method: "POST", body: formData });
        const result = await response.json();

        if (!response.ok || result.error || !result.token || !result.user || !result.csrfToken) {
            loginError.textContent = result.error || "Sign in failed. Please check your credentials and try again.";
            loginError.style.display = "block";
            loginBtn.disabled = false;
            loginBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Sign In`;
            return;
        }

        saveSession(result.token, result.user, result.csrfToken);
        window.location.href = "index.html";

    } catch (err) {
        console.error(err);
        loginError.textContent = "Could not reach the server. Please try again.";
        loginError.style.display = "block";
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Sign In`;
    }

});

</script>

</body>
</html>
