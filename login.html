<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In | DHSUD-CAR Records Shelter</title>
<link rel="icon" type="image/png" href="logo.png">

<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="login.css">

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">

</head>

<body class="login-body">

<div class="login-wrap">

    <div class="login-card">

        <div class="login-brand">

            <img src="logo.png" alt="DHSUD-CAR Logo">

            <h2>DHSUD-CAR</h2>
            <span>Records Shelter</span>

        </div>

        <h1>Sign In</h1>
        <p class="login-sub">Enter your assigned account credentials.</p>

        <form id="loginForm">

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="loginEmail" required placeholder="name@dhsud.gov.ph">
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="loginPassword" required placeholder="••••••••">
            </div>

            <div id="loginError" class="login-error" style="display:none;"></div>

            <button type="submit" class="login-btn" id="loginBtn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Sign In
            </button>

        </form>

        <p class="login-footnote">
            Accounts are issued by your division administrator.
            Contact IT support if you cannot access your account.
        </p>

    </div>

</div>

<script src="auth.js"></script>
<script>

const loginForm = document.getElementById("loginForm");
const loginBtn = document.getElementById("loginBtn");
const loginError = document.getElementById("loginError");

const currentSession = getSession();
if (currentSession && currentSession.token) {
    window.location.href = "index.html";
}

loginForm.addEventListener("submit", async function (e) {

    e.preventDefault();

    loginError.style.display = "none";
    loginBtn.disabled = true;
    loginBtn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> Signing in...`;

    const email = document.getElementById("loginEmail").value.trim();
    const password = document.getElementById("loginPassword").value;

    try {

        const formData = new FormData();
        formData.append("action", "login");
        formData.append("email", email);
        formData.append("password", password);

        const response = await fetch(API_URL, { method: "POST", body: formData });
        const result = await response.json();

        if (result.error) {
            loginError.textContent = result.error;
            loginError.style.display = "block";
            loginBtn.disabled = false;
            loginBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Sign In`;
            return;
        }

        saveSession(result.token, result.user);
        window.location.href = "index.html";

    } catch (err) {
        console.error(err);
        loginError.textContent = "Could not reach the server. Please try again.";
        loginError.style.display = "block";
        loginBtn.disabled = false;
        loginBtn.innerHTML = `<i class="fa-solid fa-right-to-bracket"></i> Sign In`;
    }

});

</script>

</body>
</html>
